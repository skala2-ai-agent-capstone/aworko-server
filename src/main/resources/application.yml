spring:
  application:
    name: aworko-server
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
    # MCP·Agent 메시지와 같은 snake_case (task_id, deliverable_version …)
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 고객 자료 업로드: 파일당 20MB, 「새 업무 생성」 한 번에 여러 파일
      max-file-size: 20MB
      max-request-size: 60MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/axeval}
    username: ${DB_USERNAME:axeval}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 기존 42개 테이블은 MCP 쪽 001_schema.sql이 소유한다. 백엔드는 매핑 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # 아웃박스 릴레이가 브로커 수신 확인(confirm)을 받은 뒤에만 SENT로 표시한다
    publisher-confirm-type: simple
    listener:
      simple:
        # 처리 중 예외가 난 DLQ 메시지를 무한 재전달하지 않는다
        default-requeue-rejected: false
  flyway:
    # 백엔드 전용 테이블만 관리. 기존 스키마 위에 baseline을 잡고 별도 이력 테이블을 쓴다.
    table: flyway_backend_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # HMAC-SHA256 서명 키. 32바이트 이상. 운영에서는 반드시 JWT_SECRET 환경변수로 주입한다.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    issuer: aworko-server
  mcp:
    # business-mcp 내부 API. 중간 피드백 요청 행(범위·대화 스냅샷)을 MCP가 만든다
    base-url: ${MCP_INTERNAL_URL:http://localhost:8001}
    # MCP의 INTERNAL_API_KEY와 같은 값. 운영(prod)에는 기본값이 없어서 없으면 기동하지 않는다
    internal-key: ${INTERNAL_API_KEY:}
    timeout: 5s
  llm:
    # 업무 공간 대화. llm-proxy를 거쳐야 대화가 llm_exchanges(→ messages 뷰)에 기록된다
    base-url: ${LLM_PROXY_URL:http://localhost:4000}
    # llm-proxy PROXY_KEYS의 workspace-backend 키. 운영(prod)에는 기본값이 없어서 없으면 기동하지 않는다
    api-key: ${LLM_PROXY_KEY:}
    model: ${LLM_MODEL:gemma4}
    # 로컬 LLM(vLLM) 응답 대기 상한
    timeout: 180s
  live-evaluation:
    # 실시간 피드백 요청 간격(사용자별)
    min-interval: 5m
  messaging:
    outbox:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      poll-interval: 1s
      batch-size: 50
      confirm-timeout: 5s
    # 재시도 큐에서 머무는 시간. 지나면 요청 큐로 돌아간다 (큐 인자라 바꾸면 큐를 다시 만들어야 한다)
    evaluation-retry-delay: 30s
    live-evaluation-retry-delay: 5s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
