spring:
  application:
    name: aworko-server
  profiles:
    default: local
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
    # MCP·Agent 메시지와 같은 snake_case (task_id, deliverable_version …)
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/axeval}
    username: ${DB_USERNAME:axeval}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # 기존 42개 테이블은 MCP 쪽 001_schema.sql이 소유한다. 백엔드는 매핑 검증만 한다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    # 백엔드 전용 테이블만 관리. 기존 스키마 위에 baseline을 잡고 별도 이력 테이블을 쓴다.
    table: flyway_backend_history
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    # HMAC-SHA256 서명 키. 32바이트 이상. 운영에서는 반드시 JWT_SECRET 환경변수로 주입한다.
    secret: ${JWT_SECRET:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    issuer: aworko-server

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
